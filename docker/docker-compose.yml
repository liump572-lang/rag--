name: knowledge-qa-system

services:
  # ═══════════════════════════════════════════════════════════════
  #  Infrastructure
  # ═══════════════════════════════════════════════════════════════

  mysql:
    image: mysql:8.0
    container_name: kqa-mysql
    restart: unless-stopped
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-knowledge_qa_system}
      MYSQL_USER: ${MYSQL_USER:-qa_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qa_app_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=200
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD:-root123}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: kqa-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:4.4.16
    container_name: kqa-neo4j
    restart: unless-stopped
    ports:
      - '7474:7474'
      - '7687:7687'
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/neo4j_password}
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ['CMD', 'cypher-shell', '-u', 'neo4j', '-p', '${NEO4J_PASSWORD:-neo4j_password}', 'RETURN 1']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: kqa-chromadb
    restart: unless-stopped
    ports:
      - '8001:8000'
    environment:
      IS_PERSISTENT: TRUE
      PERSIST_DIRECTORY: /chroma/data
      ANONYMIZED_TELEMETRY: FALSE
    volumes:
      - chromadb_data:/chroma/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/v1/heartbeat']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
  # ═══════════════════════════════════════════════════════════════
  #  Application
  # ═══════════════════════════════════════════════════════════════

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: kqa-backend
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-qa_app}:${MYSQL_PASSWORD:-qa_app_pass}@mysql:3306/${MYSQL_DATABASE:-knowledge_qa_system}?charset=utf8mb4
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_password}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-deepseek-embedding}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-to-a-random-secret-key}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
      - ..:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    container_name: kqa-celery-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-qa_app}:${MYSQL_PASSWORD:-qa_app_pass}@mysql:3306/${MYSQL_DATABASE:-knowledge_qa_system}?charset=utf8mb4
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_password}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-deepseek-embedding}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
      - ..:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    command: ['celery', '-A', 'app.tasks.celery_app', 'worker', '-l', 'info', '-Q', 'parse_queue', '--concurrency=4']

  celery-kg-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    container_name: kqa-celery-kg-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-qa_app}:${MYSQL_PASSWORD:-qa_app_pass}@mysql:3306/${MYSQL_DATABASE:-knowledge_qa_system}?charset=utf8mb4
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j_password}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-v4-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-deepseek-embedding}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
      - ..:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    command: ['celery', '-A', 'app.tasks.celery_app', 'worker', '-l', 'info', '-Q', 'kg_queue', '--concurrency=8']

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: kqa-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:80/']
      interval: 30s
      timeout: 5s
      retries: 3

  frontend-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.dev
    container_name: kqa-frontend-dev
    restart: unless-stopped
    ports:
      - '5173:5173'
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/index.html:/app/index.html
      - ../frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
    profiles:
      - dev

volumes:
  mysql_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  chromadb_data:
  uploads_data:
